services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Defina MONGO_ROOT_USERNAME no .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Defina MONGO_ROOT_PASSWORD no .env}
      MONGO_INITDB_DATABASE: nurseflow
    volumes:
      - mongo_data:/data/db
    networks:
      - nurseflow_internal
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host 127.0.0.1 --port 27017
          --username "$$MONGO_INITDB_ROOT_USERNAME"
          --password "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin
          --eval "db.adminCommand('ping').ok" | grep -q '^1$$'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  optimizer:
    build:
      context: ./optimizer
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - nurseflow_internal
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/saude').status==200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      optimizer:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: ${MONGODB_URI:?Defina MONGODB_URI no .env}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env}
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS:-28800}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-15}
      PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-30}
      OPTIMIZER_URL: http://optimizer:8000
      OPTIMIZER_TIMEOUT_MS: ${OPTIMIZER_TIMEOUT_MS:-120000}
      OPTIMIZER_TIME_LIMIT_SECONDS: ${OPTIMIZER_TIME_LIMIT_SECONDS:-30}
      SEED_COORDENACAO_NOME: ${SEED_COORDENACAO_NOME:-}
      SEED_COORDENACAO_EMAIL: ${SEED_COORDENACAO_EMAIL:-}
      SEED_COORDENACAO_CPF: ${SEED_COORDENACAO_CPF:-}
      SEED_COORDENACAO_SENHA: ${SEED_COORDENACAO_SENHA:-}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    networks:
      - nurseflow_internal
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/docs').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  seed-demo:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: development
      MONGODB_URI: ${MONGODB_URI:?Defina MONGODB_URI no .env}
      DEMO_SEED_ENABLED: ${DEMO_SEED_ENABLED:-false}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
      DEMO_PRO_PASSWORD: ${DEMO_PRO_PASSWORD:-}
    command: ["node", "scripts/seed-demo.js"]
    networks:
      - nurseflow_internal

  frontend:
    build:
      context: ./front-end
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      seed-demo:
        condition: service_completed_successfully
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - nurseflow_internal

networks:
  nurseflow_internal:
    driver: bridge

volumes:
  mongo_data: