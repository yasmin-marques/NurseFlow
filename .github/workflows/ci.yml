name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            back-end/package-lock.json
            front-end/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node.js dependencies
        run: |
          npm ci
          npm ci --prefix back-end
          npm ci --prefix front-end

      - name: Build backend
        run: npm --prefix back-end run build

      - name: Run backend unit tests
        run: npm --prefix back-end test -- --runInBand

      - name: Run backend end-to-end tests
        run: npm run test:e2e

      - name: Run frontend tests and build
        run: |
          npm run test:front
          npm --prefix front-end run build

      - name: Install optimizer test dependencies
        run: python -m pip install -r optimizer/requirements-dev.txt

      - name: Run optimizer tests
        run: python -m pytest tests
        working-directory: optimizer
