services:

  mongo:
    image: mongo:8

    container_name: nurseflow-mongo

    restart: always

    ports:
      - "127.0.0.1:27017:27017"

    environment:
      MONGO_INITDB_DATABASE: nurseflow

    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

    volumes:
      - ./mongo/script.js:/docker-entrypoint-initdb.d/script.js:ro
      - mongo_data:/data/db


  # Otimizador de escalas (FastAPI + OR-Tools). A API NestJS local o acessa em http://localhost:8000.
  optimizer:
    build:
      context: ../optimizer
    container_name: nurseflow-optimizer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/saude').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  mongo_data: