services:

  mongo:
    image: mongo:8

    container_name: nurseflow-mongo

    restart: always

    ports:
      - "27017:27017"

    environment:
      MONGO_INITDB_DATABASE: nurseflow

    volumes:
      - ./mongo/script.js:/docker-entrypoint-initdb.d/script.js:ro
      - mongo_data:/data/db


volumes:
  mongo_data: